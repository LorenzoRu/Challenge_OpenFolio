<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bientôt disponible — OpenFolio</title>
	<link rel="stylesheet" href="/static/css/tokens.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="construction-body">
	<header class="construction-header">
		<a class="app-logo" href="/">
			<span class="material-symbols-rounded">dashboard</span>
			<span>OpenFolio</span>
		</a>
	</header>

	<main class="construction-main">
		<div class="construction-hero">
			<span class="construction-badge">
				<span class="material-symbols-rounded">construction</span>
				<span>En construction</span>
			</span>

			<h1 class="hero construction-title">Quelque chose de grand arrive.</h1>

			<p class="construction-text">
				OpenFolio prépare un espace simple et élégant pour créer et partager votre portfolio.
				Le site ouvrira ses portes très bientôt.
			</p>

			<div class="construction-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-label="Avancement du développement">
				<span class="construction-progress-bar"></span>
			</div>

			<p class="construction-note">
				<span class="material-symbols-rounded">schedule</span>
				Disponible prochainement
			</p>
		</div>
	</main>

	<footer class="construction-footer">
		<span>© 2026 OpenFolio</span>
		<a class="construction-link" href="/auth/login">
			<span class="material-symbols-rounded">lock</span>
			<span>Espace admin</span>
		</a>
	</footer>
</body>
</html>
