<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dashboard — OpenFolio</title>
	<link rel="stylesheet" href="/static/css/tokens.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
	<header class="app-header">
		<a class="app-logo" href="/admin">
			<span class="material-symbols-rounded">dashboard</span>
			<span>OpenFolio</span>
		</a>
		<div class="app-user">
			<span class="app-email">{{.Email}}</span>
			<form method="POST" action="/auth/logout">
				<button type="submit" class="btn btn-secondary">
					<span class="material-symbols-rounded">logout</span>
					<span>Deconnexion</span>
				</button>
			</form>
		</div>
	</header>

	<main class="dashboard">
		<h1 class="hero">Dashboard</h1>

		<section class="stats-grid">
			<article class="card stat-card">
				<span class="material-symbols-rounded stat-icon">folder</span>
				<div>
					<p class="stat-value">3</p>
					<p class="stat-label">Projets actifs</p>
				</div>
			</article>
			<article class="card stat-card">
				<span class="material-symbols-rounded stat-icon">dashboard_customize</span>
				<div>
					<p class="stat-value">5</p>
					<p class="stat-label">Templates</p>
				</div>
			</article>
			<article class="card stat-card">
				<span class="material-symbols-rounded stat-icon">image</span>
				<div>
					<p class="stat-value">12</p>
					<p class="stat-label">Medias</p>
				</div>
			</article>
		</section>

		<div class="dashboard-columns">
			<section class="card pages-section">
				<h2>Mes pages</h2>
				<ul class="page-list">
					<li class="page-item">
						<span class="page-name">Accueil</span>
						<button type="button" class="btn btn-secondary btn-sm">
							<span class="material-symbols-rounded">edit</span>
							<span>Modifier</span>
						</button>
					</li>
					<li class="page-item">
						<span class="page-name">A propos</span>
						<button type="button" class="btn btn-secondary btn-sm">
							<span class="material-symbols-rounded">edit</span>
							<span>Modifier</span>
						</button>
					</li>
					<li class="page-item">
						<span class="page-name">Projets</span>
						<button type="button" class="btn btn-secondary btn-sm">
							<span class="material-symbols-rounded">edit</span>
							<span>Modifier</span>
						</button>
					</li>
					<li class="page-item">
						<span class="page-name">Contact</span>
						<button type="button" class="btn btn-secondary btn-sm">
							<span class="material-symbols-rounded">edit</span>
							<span>Modifier</span>
						</button>
					</li>
				</ul>
			</section>

			<aside class="card preview-section">
				<h2>Apercu du portfolio</h2>
				<div class="preview-window">
					<div class="preview-hero"></div>
					<div class="preview-lines">
						<span class="preview-line"></span>
						<span class="preview-line short"></span>
					</div>
				</div>
				<button type="button" class="btn btn-primary">
					<span class="material-symbols-rounded">visibility</span>
					<span>Voir le portfolio</span>
				</button>
			</aside>
		</div>
	</main>
</body>
</html>
