<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Maintenance en cours — OpenFolio</title>
	<link rel="stylesheet" href="/static/css/tokens.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="construction-body">
	<header class="construction-header">
		<a class="app-logo" href="/">
			<span class="material-symbols-rounded">dashboard</span>
			<span>OpenFolio</span>
		</a>
	</header>

	<main class="construction-main">
		<div class="construction-hero">
			<span class="construction-badge">
				<span class="material-symbols-rounded">engineering</span>
				<span>Maintenance</span>
			</span>

			<h1 class="hero construction-title">Le site est en maintenance.</h1>

			<p class="construction-text">
				Nous effectuons quelques ajustements pour améliorer votre expérience.
				Le portfolio sera de nouveau accessible très bientôt.
			</p>

			<p class="construction-note">
				<span class="material-symbols-rounded">schedule</span>
				Merci de votre patience
			</p>
		</div>
	</main>

	<footer class="construction-footer">
		<span>© 2026 OpenFolio</span>
		<a class="construction-link" href="/auth/login">
			<span class="material-symbols-rounded">lock</span>
			<span>Espace admin</span>
		</a>
	</footer>
</body>
</html>
